# Shared app rules for both the HTTP and HTTPS listeners.

# Flutter falls back to index.html for unmatched paths, which keeps deep links
# and the service worker navigation fallback working.
try_files $uri $uri/ /index.html;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json
           application/wasm image/svg+xml application/octet-stream;

# Entry points must always revalidate, otherwise a new deployment can be
# masked by a stale cached shell.
location = /index.html                { add_header Cache-Control "no-cache" always; }
location = /sw.js                     { add_header Cache-Control "no-cache" always; }
location = /flutter_service_worker.js { add_header Cache-Control "no-cache" always; }
location = /flutter_bootstrap.js      { add_header Cache-Control "no-cache" always; }
location = /flutter.js                { add_header Cache-Control "no-cache" always; }
location = /main.dart.js              { add_header Cache-Control "no-cache" always; }
location = /manifest.json             { add_header Cache-Control "no-cache" always; }
location = /version.json              { add_header Cache-Control "no-cache" always; }
location = /favicon.png               { add_header Cache-Control "public, max-age=604800" always; }

# Build outputs are versioned per release, so they can be cached hard.
location ^~ /assets/    { add_header Cache-Control "public, max-age=31536000, immutable" always; }
location ^~ /canvaskit/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
location ^~ /icons/     { add_header Cache-Control "public, max-age=604800" always; }
