# Workout Timer PWA
# Served on both :80 and :443 so the app stays reachable even if 443 is still
# blocked upstream. Service workers / "Install app" require the TLS listener.
# __SERVER_NAME__ is replaced with the public IP or DNS name at deploy time.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    root /var/www/workouts-timer;
    index index.html;

    include /etc/nginx/snippets/workouts-timer-app.conf;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root /var/www/workouts-timer;
    index index.html;

    include /etc/nginx/snippets/workouts-timer-app.conf;
}
