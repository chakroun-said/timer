name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5' # matches the locally tested SDK
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # A project site is served from https://<owner>.github.io/<repo>/, so the
      # app must be built with that subpath as its base href or every asset 404s.
      # A user/organisation site (<owner>.github.io) is served from the root.
      - name: Determine base href
        id: base
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # --no-web-resources-cdn is required: otherwise Flutter loads CanvasKit
      # from gstatic.com and the app cannot work offline.
      - name: Build web
        run: |
          flutter build web --release \
            --no-web-resources-cdn \
            --base-href "${{ steps.base.outputs.href }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
