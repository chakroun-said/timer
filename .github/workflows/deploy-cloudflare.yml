name: Deploy web app to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  # Served at https://<PROJECT_NAME>.pages.dev
  PROJECT_NAME: workouts-timer

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5' # matches the locally tested SDK
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Cloudflare Pages serves the site from the domain root, so the default
      # base href is already correct and no --base-href is needed.
      # --no-web-resources-cdn is required: otherwise Flutter loads CanvasKit
      # from gstatic.com and the app cannot work offline.
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

      # Creates the Pages project on the first run; once it exists the command
      # fails harmlessly and is ignored. Keeping this here means no manual
      # project setup is needed in the Cloudflare dashboard.
      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT_NAME" \
            --production-branch=main || echo "Pages project already exists"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy build/web \
            --project-name="$PROJECT_NAME" \
            --branch=main
